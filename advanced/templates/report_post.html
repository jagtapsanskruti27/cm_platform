<!DOCTYPE html>
<html>
<head>
    <title>Report Post</title>

    <style>

        body{
            font-family: Arial;
            background: #f5f5f5;
            padding: 40px;
        }

        .box{
            width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        textarea{
            width: 100%;
            height: 120px;
            padding: 10px;
            margin-top: 10px;
        }

        button{
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            background: red;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

    </style>

</head>
<body>

<div class="box">

    <h2>🚩 Report Post</h2>

    <p>
        Are you sure you want to report this post?
    </p>

    <form method="POST">

        {% csrf_token %}

        <textarea
            name="reason"
            placeholder="Enter report reason..."
            required
        ></textarea>

        <button type="submit">
            Submit Report
        </button>

    </form>

</div>

</body>
</html>
