<!DOCTYPE html>
<html>
<head>
    <title>Admin Reports</title>

    <style>

        body{
            font-family: Arial;
            background: #f5f5f5;
            padding: 40px;
        }

        .container{
            width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .report-box{
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .title{
            font-weight: bold;
            margin-bottom: 10px;
        }

    </style>

</head>
<body>

<div class="container">

    <h2>🛠 Admin Report Panel</h2>

    {% for report in reports %}

        <div class="report-box">

            <div class="title">
                Reported By:
                {{ report.reporter.username }}
            </div>

            <p>
                <strong>Post ID:</strong>
                {{ report.post.id }}
            </p>

            <p>
                <strong>Post Owner:</strong>
                {{ report.post.user.username }}
            </p>

            <p>
                <strong>Reason:</strong>
                {{ report.reason }}
            </p>

            <p>
                <strong>Date:</strong>
                {{ report.created_at }}
            </p>

        </div>

    {% empty %}

        <p>No reports available.</p>

    {% endfor %}

</div>

</body>
</html>
