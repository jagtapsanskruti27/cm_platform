<!DOCTYPE html>

<html>

<head>

<title>Story</title>

<style>

body{

background:black;
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

}

.story{

width:420px;
height:700px;
background:#111;
border-radius:15px;
overflow:hidden;
position:relative;

}

.progress{

position:absolute;
top:10px;
left:10px;
height:4px;
background:white;
width:0%;
animation:progress 5s linear forwards;

}

img{

width:100%;
height:100%;
object-fit:cover;

}

.username{

position:absolute;
top:25px;
left:20px;
color:white;
font-size:18px;
font-weight:bold;

}

@keyframes progress{

from{
width:0%;
}

to{
width:95%;
}

}

</style>

</head>

<body>

<div class="story">

<div class="progress"></div>

<div class="username">

{{ story.user.username }}

</div>

<img src="data:image/png;base64,{{ story.image }}">

</div>

<script>

setTimeout(function(){

window.location.href="/feed/";

},5000);

</script>

</body>

</html>
