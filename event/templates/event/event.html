{% extends 'index.html' %}

{% block content %}

<style>
    .event-page {
        max-width: 900px;
        margin: 0 auto;
        padding: 60px 20px 100px;
    }

    .event-page h1 {
        font-family: 'Syne', sans-serif;
        font-size: 2.6rem;
        margin-bottom: 24px;
        color: var(--text);
    }

    .event-form,
    .event-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 28px;
        margin-bottom: 24px;
    }

    .event-form label,
    .event-form input,
    .event-form textarea,
    .event-form button {
        width: 100%;
    }

    .event-form .form-group {
        margin-bottom: 18px;
    }

    .event-form input,
    .event-form textarea,
    .event-form select {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
        color: var(--text);
        font-size: 0.95rem;
    }

    .event-form button {
        margin-top: 8px;
    }

    .event-card {
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .event-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 30px rgba(0,0,0,0.12);
    }

    .event-card h3 {
        margin-top: 0;
        font-family: 'Syne', sans-serif;
        font-size: 1.3rem;
        color: var(--text);
    }

    .event-card p {
        margin: 10px 0;
        color: var(--muted);
        line-height: 1.6;
    }

    .event-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 16px;
    }

    .join-btn,
    .cancel-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 18px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 600;
    }

    .join-btn { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; }
    .cancel-btn { background: rgba(255,90,110,0.12); color: var(--danger); }
</style>

<div class="event-page">
    <h1>Events</h1>

    <form method="POST" class="event-form">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">Create Event</button>
    </form>

    {% for event in events %}
    <div class="event-card">
        <h3>{{ event.title }}</h3>
        <p><strong>Description:</strong> {{ event.description }}</p>
        <p><strong>Location:</strong> {{ event.location }}</p>
        <p><strong>Date:</strong> {{ event.event_date }}</p>
        <div class="event-actions">
            <a class="join-btn" href="{% url 'join_event' event.id %}">Join Event</a>
            <a class="cancel-btn" href="{% url 'delete_event' event.id %}">Cancel Event</a>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}
