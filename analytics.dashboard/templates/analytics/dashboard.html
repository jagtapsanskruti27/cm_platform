<!DOCTYPE html>
<html>
<head>
    <title>Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h1>Analytics Dashboard</h1>

<h2>Most Liked Posts</h2>
<table border="1">
    <tr>
        <th>Post</th>
        <th>Likes</th>
    </tr>

    {% for post in most_liked_posts %}
    <tr>
        <td>{{ post.title }}</td>
        <td>{{ post.likes }}</td>
    </tr>
    {% endfor %}
</table>

<br>

<h2>User Activity</h2>
<table border="1">
    <tr>
        <th>User</th>
        <th>Total Posts</th>
    </tr>

    {% for user in user_activity %}
    <tr>
        <td>{{ user.username }}</td>
        <td>{{ user.post_count }}</td>
    </tr>
    {% endfor %}
</table>

<br>

<h2>Most Liked Posts Graph</h2>
<canvas id="likesChart"></canvas>

<script>
const labels = [
{% for post in most_liked_posts %}
"{{ post.title }}",
{% endfor %}
];

const likes = [
{% for post in most_liked_posts %}
{{ post.likes }},
{% endfor %}
];

new Chart(document.getElementById('likesChart'), {
    type: 'bar',
    data: {
        labels: labels,
        datasets: [{
            label: 'Likes',
            data: likes
        }]
    }
});
</script>

</body>
</html>
