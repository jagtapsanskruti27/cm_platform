{% extends "analytics/dashboard.html" %}

{% block dashboard_content %}

<h2>Users</h2>

<div class="card table-card">
    <table class="table table-dark table-hover">
        <thead>
            <tr>
                <th>Username</th>
                <th>Email</th>
            </tr>
        </thead>

        <tbody>
        {% for user in users %}
            <tr>
                <td>{{ user.username }}</td>
                <td>{{ user.email }}</td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="2">No users found.</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
